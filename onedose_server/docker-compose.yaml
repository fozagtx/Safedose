services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: onedose
      POSTGRES_PASSWORD: "CA-zEc2qwqpUAyUMa8_Q8doSgRz_RYmN"
    volumes:
      - onedose_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "pTTnMkdVrX8Rf23pvHHAXVUqWFyWER8r"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: onedose_test
      POSTGRES_PASSWORD: "4y0pa8rSLnjLgifq9BHl4jl5Nkth0jnD"
    volumes:
      - onedose_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "nXpOJ23VxjFIx5lmTW1qC9izTgLDX2-e"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  onedose_data:
  onedose_test_data:
